# 한국 식별번호 기본 규칙.
# 사용자 정의는 rules/user/*.yaml 에 두면 이 파일보다 먼저 평가된다.
rules:
  - id: ko-rrn
    pattern: '(?-u)\b[0-9]{6}[-\s]?[1-8][0-9]{6}\b'
    # 체크섬이 아니라 형식·생년월일·성별코드를 본다.
    # 2020-10 이후 발급분은 뒷자리가 임의값이라 체크섬이 성립하지 않는다.
    # 미탐(누출)이 오탐보다 비싸므로 느슨한 쪽을 기본으로 둔다.
    validator: ko_rrn
    action: deny

  - id: ko-brn
    pattern: '(?-u)\b[0-9]{3}-?[0-9]{2}-?[0-9]{5}\b'
    validator: ko_brn
    action: deny

  - id: ko-phone
    pattern: '(?-u)\b01[016789][-\s]?[0-9]{3,4}[-\s]?[0-9]{4}\b'
    action: deny
