name: 카드번호
cases:
  - text: "카드 4242-4242-4242-4242 로 결제"    # 공개 테스트 번호
    expect: deny
    rule: card
  - text: "5555555555554444"
    expect: deny
    rule: card

  # Luhn 불일치 → 통과. 검증기가 없으면 이런 것까지 전부 걸린다.
  - text: "4242424242424243"
    expect: allow
  - text: "주문번호 1234 5678 1234 5678"
    expect: allow
  - text: "회의실 예약번호 1111 2222 3333 4445"
    expect: allow

  # 알려진 한계: 카드가 아니어도 16자리가 Luhn을 통과하면 걸린다.
  # (1111 2222 3333 4444 는 실제로 Luhn 유효값이다.)
  # 검증기는 오탐을 줄이지만 없애지는 못한다 — 필요하면 user/ 규칙으로 예외를 만든다.
  - text: "1111 2222 3333 4444"
    expect: deny
    rule: card
