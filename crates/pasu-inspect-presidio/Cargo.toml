[package]
name = "pasu-inspect-presidio"
version = "0.2.0"
description = "Read Microsoft Presidio recognizer YAML as a pasu Inspector, reporting what does not survive the conversion"
keywords = ["pii", "presidio", "privacy", "llm", "guardrail"]
categories = ["text-processing"]
readme = "README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
pasu-core = { version = "0.2.0", path = "../pasu-core" }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[dev-dependencies]
pasu-core = { version = "0.2.0", path = "../pasu-core" }
