[package]
name = "pasu-proxy"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The library (parse / inspect / proxy) stays decoupled behind pasu-core +
# transport (axum / reqwest). The `pasu-proxy` binary is an app-level
# composition root: it MAY depend on a concrete rule engine (pasu-rules) to
# wire and serve the proxy — the library never does.

[[bin]]
name = "pasu-proxy"
path = "src/main.rs"

[dependencies]
pasu-core = { version = "0.2.0", path = "../pasu-core" }
pasu-pii-kr = { version = "0.2.0", path = "../pasu-pii-kr" }
pasu-inspect-presidio = { version = "0.2.0", path = "../pasu-inspect-presidio" }
axum = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
serde = { workspace = true }
serde_json = { workspace = true }

# Binary-only (composition root): the rule engine + HITL UI + CLI + error context.
pasu-rules = { version = "0.2.0", path = "../pasu-rules" }
pasu-ui = { version = "0.2.0", path = "../pasu-ui" }
clap = { workspace = true, features = ["derive"] }
anyhow = { workspace = true, default-features = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "parse"
harness = false
