[package]
name = "pasu-proxy"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The library (parse / inspect / proxy) stays decoupled behind pasu-core +
# transport (axum / reqwest). The `pasu-proxy` binary is an app-level
# composition root: it MAY depend on a concrete rule engine (pasu-rules) to
# wire and serve the proxy — the library never does.

[[bin]]
name = "pasu-proxy"
path = "src/main.rs"

[dependencies]
pasu-core = { version = "0.2.0", path = "../pasu-core" }
# Optional, and off by default. The proxy's job is to run inspectors, not to know
# which ones exist — a deployment that wants neither should not compile either,
# and one that wants a scanner this repository has never heard of should not have
# to remove these first.
pasu-inspect-pii-kr = { version = "0.2.0", path = "../pasu-inspect-pii-kr", optional = true }
pasu-inspect-presidio = { version = "0.2.0", path = "../pasu-inspect-presidio", optional = true }
axum = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
serde = { workspace = true }
serde_json = { workspace = true }

# Binary-only (composition root): the rule engine + HITL UI + CLI + error context.
pasu-rules = { version = "0.2.0", path = "../pasu-rules" }
pasu-ui = { version = "0.2.0", path = "../pasu-ui" }
clap = { workspace = true, features = ["derive"] }
anyhow = { workspace = true, default-features = true }

[dev-dependencies]
# The e2e tests exercise a real inspector through the proxy, so they need one —
# but only the tests do, which is why it is here rather than a hard dependency.
pasu-inspect-pii-kr = { version = "0.2.0", path = "../pasu-inspect-pii-kr" }
tower = { version = "0.5", features = ["util"] }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "parse"
harness = false

[features]
default = ["pii-kr", "presidio"]
# The scanners this repository ships. Both are on by default so the binary is
# useful out of the box; a library user or a slimmer build turns them off with
# default-features = false.
pii-kr = ["dep:pasu-inspect-pii-kr"]
presidio = ["dep:pasu-inspect-presidio"]
