name: ci

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      # default-members only (core, rules, ui, audit, proxy). The eBPF stack needs nightly +
      # bpf-linker + a Linux/bpf target, so it is built and E2E-tested on Linux in
      # a separate (privileged) job — see the ci.md plan below.
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
      # optional OTLP verdict export (feature-gated; keeps the default build pure)
      - name: otel feature (build + unit)
        run: cargo test -p pasu-audit --features otel

  ebpf:
    name: eBPF build + unit (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      # 버전을 고정한다. bpf-linker 0.11.0(2026-08-12)부터 시스템 LLVM(llvm-sys
      # 21~23)을 요구하는데, LLVM 21을 깔아도 0.11이 그보다 최신 API
      # (LLVMParseIRInContext2)를 참조해 링크가 깨진다. 0.10.4 는 러너 기본
      # 환경에서 그대로 빌드된다. 0.11 이상으로 올리려면 맞는 LLVM 버전을
      # 함께 확정해야 하며, 이는 별건으로 다룬다.
      - name: install bpf-linker
        run: cargo install bpf-linker --locked --version 0.10.4
      - uses: Swatinem/rust-cache@v2
      # builds the eBPF program (aya-build) and runs control-plane unit tests
      # (EgressLayer, daemon policy lowering); the cgroup E2E runs in the
      # privileged ebpf-e2e job.
      - name: build + unit-test eBPF stack
        run: |
          cargo test -p pasu-egress --lib
          cargo test -p pasu-daemon
          cargo test -p pasu-cli

  ebpf-e2e:
    name: eBPF E2E (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      # 버전을 고정한다. bpf-linker 0.11.0(2026-08-12)부터 시스템 LLVM(llvm-sys
      # 21~23)을 요구하는데, LLVM 21을 깔아도 0.11이 그보다 최신 API
      # (LLVMParseIRInContext2)를 참조해 링크가 깨진다. 0.10.4 는 러너 기본
      # 환경에서 그대로 빌드된다. 0.11 이상으로 올리려면 맞는 LLVM 버전을
      # 함께 확정해야 하며, 이는 별건으로 다룬다.
      - name: install bpf-linker
        run: cargo install bpf-linker --locked --version 0.10.4
      - uses: Swatinem/rust-cache@v2
      - name: build E2E binaries
        run: |
          cargo test -p pasu-egress --test egress_e2e --no-run
          cargo test -p pasu-cli --test run_e2e --no-run
      # cgroup egress E2E needs root (CAP_BPF + cgroup attach). PASU_E2E_KERNEL
      # opts the tests in; without it (and without root) they self-skip.
      - name: run E2E (privileged cgroup egress + pasu run)
        run: |
          sudo env "PATH=$PATH" "RUSTUP_HOME=$HOME/.rustup" "CARGO_HOME=$HOME/.cargo" \
            PASU_E2E_KERNEL=1 \
            cargo test -p pasu-egress --test egress_e2e -- --test-threads=1 --nocapture
          sudo env "PATH=$PATH" "RUSTUP_HOME=$HOME/.rustup" "CARGO_HOME=$HOME/.cargo" \
            PASU_E2E_KERNEL=1 \
            cargo test -p pasu-cli --test run_e2e -- --test-threads=1 --nocapture

  supply-chain:
    name: cargo-deny (advisories · licenses · sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  # Added incrementally (design: docs/ci.md):
  #  - eBPF kernel-version matrix (5.15 / 6.x / 7.x)
  #  - platform: LLM-API proxy on macOS/Windows (no eBPF)
  #  - release: SLSA provenance (at first release)
