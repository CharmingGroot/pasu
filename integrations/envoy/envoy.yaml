# Envoy in front of an LLM provider, with pasu as the ext_proc server.
#
# pasu side:
#   pasu-proxy --frontend ext-proc --listen 0.0.0.0:8791 --policy rules.yaml [--block-pii-kr]
#
# The filter settings below are the part that matters; the listener and the
# provider cluster are an ordinary Envoy setup. Verified against Envoy 1.37 with
# a plain-HTTP provider; the TLS block for api.openai.com is standard Envoy.
static_resources:
  listeners:
  - name: llm
    address: { socket_address: { address: 0.0.0.0, port_value: 10000 } }
    # BUFFERED bodies count against this. Envoy's default refuses large
    # prompts (413) and long completions (500); both are fail-closed.
    per_connection_buffer_limit_bytes: 67108864   # 64 MiB, pasu's own response cap
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: llm
          route_config:
            virtual_hosts:
            - name: provider
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                route: { cluster: provider, auto_host_rewrite: true, timeout: 300s }
          http_filters:
          - name: envoy.filters.http.ext_proc
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
              grpc_service:
                envoy_grpc: { cluster_name: pasu }
                timeout: 10s
              # false (the default) is what makes an unreachable pasu a 500
              # rather than a pass. Never set it to true.
              failure_mode_allow: false
              # Envoy's default is 200 ms. Judging is fast, but with the HITL
              # UI (--ui) an Ask waits for a person: set this above the
              # approval timeout (120 s), or the wait ends as a 504.
              message_timeout: 10s
              processing_mode:
                request_header_mode: SEND    # routing; asks upstream for identity encoding
                response_header_mode: SEND   # status, content type, encoding
                request_body_mode: BUFFERED  # prompt screening needs the whole body
                response_body_mode: BUFFERED # tool calls are judged before the client sees any byte
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: pasu
    type: STRICT_DNS
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config: { http2_protocol_options: {} }
    load_assignment:
      cluster_name: pasu
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: pasu, port_value: 8791 } } } }] }]
  - name: provider
    type: LOGICAL_DNS
    dns_lookup_family: V4_ONLY
    per_connection_buffer_limit_bytes: 67108864
    load_assignment:
      cluster_name: provider
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: api.openai.com, port_value: 443 } } } }] }]
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: api.openai.com
