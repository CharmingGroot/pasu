[workspace]
resolver = "2"
members = [
    "crates/pasu-core",    "crates/pasu-rules",
    "crates/pasu-ui",
    "crates/pasu-audit",
    "crates/pasu-ebpf-common",
    "crates/pasu-ebpf",
    "crates/pasu-egress",
    "crates/pasu-daemon",
    "crates/pasu-cli",
    "crates/pasu-proxy",
    "crates/pasu-pii-kr",
]
# The eBPF stack needs nightly + bpf-linker + a Linux/bpf target, so it is kept
# out of default-members: `cargo build/test` and CI (stable) only touch the
# portable crates. Build the eBPF stack explicitly on Linux (see crates/pasu-egress).
default-members = [
    "crates/pasu-core",    "crates/pasu-rules",
    "crates/pasu-ui",
    "crates/pasu-audit",
    "crates/pasu-proxy",
    "crates/pasu-pii-kr",
]

[workspace.package]
edition = "2021"
# MSRV. 올릴 때는 CHANGELOG 에 적고 CI 의 msrv 잡도 함께 올린다.
# 사용자 툴체인이 이보다 낮으면 알 수 없는 컴파일 에러 대신 명확한 안내가 나온다.
#
# 1.86 인 이유는 두 겹이다.
#   - eBPF 계열(pasu-ebpf, pasu-ebpf-common)이 edition 2024 를 쓰고, edition 2024
#     자체가 1.85 이상을 요구한다.
#   - rustls 가 끌고 오는 icu_* 계열이 1.86 을 요구한다(CI 의 msrv 잡이 잡아냈다).
# 즉 실효 하한은 의존성이 정한다. 값만 선언하고 검사하지 않으면 이런 어긋남을
# 사용자 환경에서야 알게 되므로, CI 에 해당 툴체인 빌드 잡을 둔다.
rust-version = "1.86"
license = "Apache-2.0"
repository = "https://github.com/CharmingGroot/pasu"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
# eBPF stack (aya). Pinned to git until aya's next crates.io release.
aya = { git = "https://github.com/aya-rs/aya", rev = "773ca715", default-features = false }
aya-build = { git = "https://github.com/aya-rs/aya", rev = "773ca715", default-features = false }
aya-ebpf = { git = "https://github.com/aya-rs/aya", rev = "773ca715", default-features = false }
aya-log = { git = "https://github.com/aya-rs/aya", rev = "773ca715", default-features = false }
aya-log-ebpf = { git = "https://github.com/aya-rs/aya", rev = "773ca715", default-features = false }
anyhow = { version = "1", default-features = false }
cargo_metadata = { version = "0.23.0", default-features = false }
clap = { version = "4.5.20", default-features = false, features = ["std"] }
env_logger = { version = "0.11.5", default-features = false }
libc = { version = "0.2.159", default-features = false }
log = { version = "0.4.22", default-features = false }
tokio = { version = "1.40.0", default-features = false }
which = { version = "6.0.0", default-features = false }

[profile.release.package.pasu-ebpf]
debug = 2
codegen-units = 1
strip = false
