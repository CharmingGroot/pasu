<svg viewBox="0 0 980 640" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title>pasu — 현재 아키텍처</title>
<desc>pasu의 두 계층과 crate 지도. 위쪽은 데이터 경로: 에이전트가 base_url을 pasu-proxy로 두면 프록시가 provider 응답의 tool call을 검사한다(협조 계층). 아래쪽은 커널 계층: pasu-egress/pasu-ebpf가 cgroup_skb로 egress를 기본 차단해 프록시를 우회한 트래픽까지 막는다(강제 계층). 두 계층은 같은 정책 파일을 쓰고 모두 pasu-core의 trait에 의존한다. pasu-pii-kr은 LLM으로 나가는 텍스트에서 한국 PII를 탐지하는 독립 crate이며, 다른 pasu crate에 의존하지 않는다. 현재는 crate만 추가된 상태이고 프록시 요청 경로 연결은 예정이다.</desc>

<defs>
  <marker id="ab" markerWidth="9" markerHeight="9" refX="6.5" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#3f7ef7"/></marker>
  <marker id="ar" markerWidth="9" markerHeight="9" refX="6.5" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#e5484d"/></marker>
  <marker id="ag" markerWidth="9" markerHeight="9" refX="6.5" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8a94ad"/></marker>
</defs>

<rect x="0" y="0" width="980" height="640" rx="18" fill="#f7f8fc" stroke="#e6e8f0" stroke-width="1.5"/>
<text x="28" y="38" font-size="19" font-weight="800" fill="#1f2430">pasu — 현재 아키텍처</text>
<text x="28" y="60" font-size="12" fill="#5b6478">협조 계층(프록시)이 의도를 거르고, 강제 계층(커널)이 우회를 막는다. 정책 파일 하나를 두 계층이 공유한다.</text>

<!-- ─────────── 데이터 경로 ─────────── -->
<rect x="28" y="82" width="924" height="176" rx="14" fill="#ffffff" stroke="#e6e8f0"/>
<text x="46" y="104" font-size="11" font-weight="700" fill="#6b7488">① 데이터 경로 · 협조 계층 (userspace · 무권한)</text>

<rect x="46" y="118" width="164" height="112" rx="12" fill="#ffffff" stroke="#c9d0e6"/>
<text x="128" y="146" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2430">에이전트</text>
<text x="128" y="164" font-size="10" text-anchor="middle" fill="#6b7488">프레임워크·언어 무관</text>
<rect x="60" y="180" width="136" height="24" rx="7" fill="#eef1f9" stroke="#cdd3e6"/>
<text x="128" y="196" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle" fill="#1f2430">base_url → :8788</text>

<line x1="212" y1="174" x2="252" y2="174" stroke="#3f7ef7" stroke-width="2" marker-end="url(#ab)"/>

<rect x="256" y="118" width="286" height="112" rx="12" fill="#eef7f4" stroke="#0d9488"/>
<text x="399" y="142" font-size="14" font-weight="700" text-anchor="middle" fill="#0f766e">pasu-proxy</text>
<text x="399" y="158" font-size="9.5" text-anchor="middle" fill="#0f766e">OpenAI · Anthropic · Gemini · SSE</text>
<rect x="270" y="168" width="258" height="22" rx="6" fill="#ffffff" stroke="#cbeae3"/>
<text x="280" y="183" font-size="9.5" fill="#1f2430">요청 ▸ PII 검사</text>
<rect x="398" y="171" width="120" height="16" rx="5" fill="#eef0fb" stroke="#c7ccf2"/>
<text x="458" y="183" font-size="8.5" text-anchor="middle" fill="#4338ca">pasu-pii-kr · 연결 예정</text>
<rect x="270" y="196" width="258" height="22" rx="6" fill="#ffffff" stroke="#cbeae3"/>
<text x="280" y="211" font-size="9.5" fill="#1f2430">응답 ▸ tool call 게이트</text>
<text x="518" y="211" font-size="9" text-anchor="end" fill="#6b7488">deny→403 · ask→HITL</text>

<line x1="544" y1="174" x2="588" y2="174" stroke="#3f7ef7" stroke-width="2" marker-end="url(#ab)"/>

<rect x="592" y="118" width="150" height="112" rx="12" fill="#ffffff" stroke="#c9d0e6" stroke-dasharray="5 4"/>
<text x="667" y="152" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2430">LLM provider</text>
<text x="667" y="172" font-size="10" text-anchor="middle" fill="#6b7488">외부</text>
<text x="667" y="192" font-size="9" text-anchor="middle" fill="#8a94ad">HTTPS</text>

<rect x="762" y="118" width="172" height="112" rx="12" fill="#fdf6ec" stroke="#efa93b"/>
<text x="848" y="142" font-size="12.5" font-weight="700" text-anchor="middle" fill="#a26a10">pasu-ui · pasu-audit</text>
<text x="848" y="162" font-size="9.5" text-anchor="middle" fill="#8a6216">승인 대기열 · egress 대시보드</text>
<text x="848" y="180" font-size="9.5" text-anchor="middle" fill="#8a6216">stderr JSONL · OTel(feature)</text>
<text x="848" y="204" font-size="9" text-anchor="middle" fill="#a08050">ask 판정을 사람에게 넘긴다</text>

<!-- ─────────── 커널 계층 ─────────── -->
<rect x="28" y="272" width="924" height="128" rx="14" fill="#ffffff" stroke="#e6e8f0"/>
<text x="46" y="294" font-size="11" font-weight="700" fill="#6b7488">② 커널 계층 · 강제 (Linux · CAP_BPF · cgroup v2)</text>

<rect x="46" y="308" width="330" height="76" rx="12" fill="#fdecec" stroke="#e5484d"/>
<text x="211" y="332" font-size="14" font-weight="700" text-anchor="middle" fill="#b42318">pasu-egress + pasu-ebpf</text>
<text x="211" y="350" font-size="9.5" text-anchor="middle" fill="#b42318">cgroup_skb egress · 기본 차단(default-deny)</text>
<text x="211" y="368" font-size="9.5" text-anchor="middle" fill="#1f2430">IPv4 ALLOW · IPv6 ALLOW6 · admin socket</text>

<path d="M399 236 L399 262 L376 262" fill="none" stroke="#e5484d" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<text x="410" y="256" font-size="9.5" fill="#b42318">프록시를 우회한 트래픽도 커널에서 drop</text>

<rect x="404" y="308" width="252" height="76" rx="12" fill="#ffffff" stroke="#c9d0e6"/>
<text x="530" y="332" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2430">pasu-daemon</text>
<text x="530" y="350" font-size="9.5" text-anchor="middle" fill="#6b7488">정책 → 커널 allowlist 로 낮춤</text>
<text x="530" y="368" font-size="9" text-anchor="middle" fill="#8a94ad">도메인은 해석 후 주입 · default:allow 는 거부</text>

<rect x="684" y="308" width="250" height="76" rx="12" fill="#ffffff" stroke="#c9d0e6"/>
<text x="809" y="332" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2430">pasu-cli</text>
<rect x="704" y="342" width="210" height="22" rx="6" fill="#eef1f9" stroke="#cdd3e6"/>
<text x="809" y="357" font-size="9.5" font-family="ui-monospace, monospace" text-anchor="middle" fill="#1f2430">pasu run -- &lt;에이전트 명령&gt;</text>
<text x="809" y="378" font-size="9" text-anchor="middle" fill="#8a94ad">전용 cgroup 에 넣고 실행</text>

<!-- ─────────── 토대 ─────────── -->
<rect x="28" y="414" width="606" height="200" rx="14" fill="#ffffff" stroke="#e6e8f0"/>
<text x="46" y="436" font-size="11" font-weight="700" fill="#6b7488">③ 토대 · 두 계층이 공유</text>

<rect x="46" y="450" width="266" height="148" rx="12" fill="#f4f4f3" stroke="#9a9a9a"/>
<text x="179" y="476" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a1a">pasu-core</text>
<text x="179" y="496" font-size="9.5" text-anchor="middle" fill="#555555">types: Event · Verdict(allow/deny/ask)</text>
<text x="179" y="514" font-size="9.5" text-anchor="middle" fill="#555555">traits: RuleEngine · Layer</text>
<text x="179" y="530" font-size="9.5" text-anchor="middle" fill="#555555">Approver · AuditSink</text>
<text x="179" y="556" font-size="9" text-anchor="middle" fill="#8a8a8a">순수 · 다른 crate 가 여기에만 의존</text>
<text x="179" y="574" font-size="9" text-anchor="middle" fill="#8a8a8a">(비순환 그래프)</text>

<rect x="332" y="450" width="284" height="148" rx="12" fill="#ffffff" stroke="#c9d0e6"/>
<text x="474" y="476" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2430">pasu-rules</text>
<text x="474" y="496" font-size="9.5" text-anchor="middle" fill="#6b7488">Falco 영감 YAML · impl RuleEngine</text>
<rect x="350" y="508" width="248" height="24" rx="7" fill="#eef1f9" stroke="#cdd3e6"/>
<text x="474" y="524" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle" fill="#1f2430">default/ + user/ · first-match</text>
<text x="474" y="552" font-size="9" text-anchor="middle" fill="#8a94ad">같은 파일을 프록시와 커널이 함께 읽는다</text>
<text x="474" y="572" font-size="9" text-anchor="middle" fill="#8a94ad">(정책의 단일 진실)</text>

<line x1="312" y1="524" x2="330" y2="524" stroke="#8a94ad" stroke-width="1.6" marker-end="url(#ag)"/>

<!-- ─────────── pasu-pii-kr ─────────── -->
<rect x="650" y="414" width="302" height="200" rx="14" fill="#ffffff" stroke="#c7ccf2"/>
<text x="668" y="436" font-size="11" font-weight="700" fill="#4338ca">④ 부속 crate (독립)</text>

<rect x="668" y="450" width="266" height="148" rx="12" fill="#eef0fb" stroke="#4f46e5"/>
<text x="801" y="476" font-size="14" font-weight="700" text-anchor="middle" fill="#3730a3">pasu-pii-kr</text>
<text x="801" y="494" font-size="9.5" text-anchor="middle" fill="#4338ca">한국 PII 차단 필터</text>
<rect x="686" y="506" width="230" height="22" rx="6" fill="#ffffff" stroke="#c7ccf2"/>
<text x="801" y="521" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle" fill="#1f2430">check(&amp;str) → Allow | Deny(Hit)</text>
<text x="801" y="544" font-size="9" text-anchor="middle" fill="#4338ca">주민·사업자번호 체크섬 · Luhn</text>
<text x="801" y="562" font-size="9" text-anchor="middle" fill="#6b7488">선형 시간(ReDoS 면역) · 0.14 µs</text>
<text x="801" y="584" font-size="9" text-anchor="middle" fill="#8a94ad">pasu-core 를 포함해 의존 없음</text>

<!-- 범례 -->
<text x="28" y="632" font-size="9" fill="#8a94ad">실선 = 데이터 흐름 · 점선(붉은색) = 커널이 막는 우회 경로 · 회색 화살표 = trait 구현</text>
</svg>
